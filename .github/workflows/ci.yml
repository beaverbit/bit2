name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: valida sintaxe python
        run: python -m py_compile bit2.py bit2/*.py
      - name: valida sintaxe shell
        run: bash -n bit2.sh

  test:
    name: test (py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: instala deps de teste
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
      - name: roda testes
        run: pytest tests/ --cov=bit2 --cov-report=term-missing
